{% extends "base.html" %}
{% block content %}
<h1>RoomieMatch</h1>
{% if user.is_authenticated %}
  <p>Signed in as <strong>{{ user.email }}</strong>.</p>
  <button id="logout">Log out</button>
  <p class="error" id="error"></p>
  <script>
    document.getElementById("logout").addEventListener("click", async () => {
      const r = await postJson("/api/auth/logout");
      if (r.status === 204 || r.status === 401) { window.location.href = "/login/"; }
      else if (r.status === 403) { document.getElementById("error").textContent = "This page is out of date. Reload it and try again."; }
      else { document.getElementById("error").textContent = "Could not log out. Please try again."; }
    });
  </script>
{% else %}
  <p>Split the rent, not the stress. Find a roommate who fits your budget, location and preferences.</p>
  <nav><a href="/login/">Log in</a><a href="/register/">Create account</a></nav>
{% endif %}
{% endblock %}
